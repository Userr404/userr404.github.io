<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Monitor</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f0f1a; color: #0f0; margin: 0; padding: 10px; }
    h1 { text-align: center; color: #00ff88; }
    .container { max-width: 1200px; margin: auto; }
    .request { 
      background: #1a1a2e; 
      margin: 10px 0; 
      padding: 15px; 
      border-radius: 8px;
      border-left: 5px solid #00ff88;
    }
    .header { display: flex; justify-content: space-between; font-weight: bold; }
    pre { background: #111; padding: 10px; border-radius: 6px; overflow-x: auto; }
    .new { animation: flash 2s; }
    @keyframes flash { 0% { background: #00ff8833; } 100% { background: #1a1a2e; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔴 Live Request Monitor</h1>
    <p style="text-align:center; color:#0f0;">Server: http://localhost:3000</p>
    <div id="requests"></div>
  </div>

  <script>
    const ws = new WebSocket('ws://localhost:3000');
    const requestsDiv = document.getElementById('requests');

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      
      if (msg.type === 'history') {
        requestsDiv.innerHTML = '';
        msg.data.forEach(req => addRequest(req));
      } 
      else if (msg.type === 'new_request') {
        addRequest(msg.data, true);
      }
    };

    function addRequest(req, isNew = false) {
      const div = document.createElement('div');
      div.className = `request ${isNew ? 'new' : ''}`;
      div.innerHTML = `
        <div class="header">
          <span>${req.timestamp} — <strong>${req.method}</strong></span>
          <span style="color:#0ff;">${req.ip}</span>
        </div>
        <h3>${req.fullUrl}</h3>
        <pre>Query: ${JSON.stringify(req.query, null, 2)}</pre>
        <pre>Headers: ${JSON.stringify(req.headers, null, 2)}</pre>
      `;
      requestsDiv.prepend(div);
    }
  </script>
</body>
</html>
