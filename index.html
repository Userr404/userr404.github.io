<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOST Header Injection Lab - userr404.github.io</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0f0f0f; 
            color: #00ff00; 
            padding: 20px; 
            line-height: 1.6;
        }
        h1 { color: #ff4444; }
        .box { 
            background: #1f1f1f; 
            padding: 20px; 
            border-radius: 8px; 
            margin: 15px 0;
            border: 1px solid #333;
        }
        pre { 
            background: #000; 
            padding: 15px; 
            border-radius: 5px; 
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔴 HOST Header Injection Test Lab</h1>
    <p><strong>Target:</strong> https://userr404.github.io</p>

    <div class="box">
        <h2>Login Form (Test uchun)</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required><br><br>
            <input type="password" id="password" placeholder="Password" required><br><br>
            <button type="submit">Login</button>
        </form>
    </div>

    <div class="box">
        <h2>📥 Qabul Qilingan POST Ma'lumotlar</h2>
        <div id="result">Hozircha hech qanday POST kelmadi...</div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const data = {
                timestamp: new Date().toISOString(),
                host: window.location.hostname,
                path: window.location.pathname,
                username: username,
                password: password,
                user_agent: navigator.userAgent,
                method: "POST",
                note: "GitHub Pages static bo'lgani uchun faqat client-side ko'rsatilyapti"
            };

            document.getElementById('result').innerHTML = `
                <strong>✅ POST Qabul Qilindi!</strong><br><br>
                <strong>Vaqt:</strong> ${new Date().toLocaleString('uz-UZ')}<br>
                <strong>Host:</strong> ${data.host}<br><br>
                <strong>POST Data:</strong><br>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;

            console.log("HOST Injection Test:", data);
        });
    </script>
</body>
</html>
