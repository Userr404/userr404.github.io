<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOST Header Injection Test Page</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #00ff00; padding: 20px; }
        h1 { color: #00ff41; }
        input, button { padding: 10px; margin: 8px 0; width: 100%; max-width: 600px; }
        button { background: #0066ff; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; background: #222; padding: 15px; border-radius: 8px; white-space: pre-wrap; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🔴 HOST Header Injection Test (userr404.github.io)</h1>
    <p>Bu sahifa login sahifasini taqlid qiladi. POST orqali test qiling.</p>

    <form id="loginForm">
        <input type="text" name="username" placeholder="Username" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <button type="submit">Login (POST)</button>
    </form>

    <div id="result"></div>

    <script>
        const form = document.getElementById('loginForm');
        const result = document.getElementById('result');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            const payload = {
                timestamp: new Date().toISOString(),
                host: window.location.hostname,
                ip: "Client IP (visible only on server)",
                user_agent: navigator.userAgent,
                data: data,
                note: "Agar HOST Header Injection ishlasa, bu ma'lumotlar boshqa host bilan kelishi mumkin"
            };

            result.innerHTML = `<strong>✅ POST Qabul Qilindi!</strong><br><br>` +
                               `<strong>Received Host:</strong> ${window.location.hostname}<br>` +
                               `<strong>Time:</strong> ${new Date().toLocaleString('uz-UZ')}<br><br>` +
                               `<strong>POST Data:</strong><br>` +
                               `<pre>${JSON.stringify(payload, null, 2)}</pre>`;

            console.log("HOST Header Test Data:", payload);
        });
    </script>
</body>
</html>
