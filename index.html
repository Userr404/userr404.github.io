<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Request Monitor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0a0a14;
      color: #00ffaa;
      margin: 0;
      padding: 15px;
    }
    .container {
      max-width: 1100px;
      margin: auto;
      background: #1a1a2e;
      border-radius: 10px;
      padding: 20px;
    }
    h1 { text-align: center; color: #00ffcc; }
    .status { text-align: center; color: #00cc88; margin: 10px 0; }
    .request {
      background: #16213e;
      margin: 12px 0;
      padding: 15px;
      border-radius: 8px;
      border-left: 5px solid #00ff88;
    }
    .time { color: #888; font-size: 14px; }
    pre {
      background: #0d0d1a;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 14px;
    }
    .new { animation: flash 2s ease; }
    @keyframes flash { 0% { background: #00ff8833; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔴 GitHub Pages Request Monitor</h1>
    <div class="status" id="status">Monitoring faol</div>

    <div id="requests"></div>
  </div>

  <script>
    const requestsDiv = document.getElementById('requests');
    let requests = JSON.parse(localStorage.getItem('allRequests')) || [];

    function saveRequests() {
      localStorage.setItem('allRequests', JSON.stringify(requests));
    }

    function addRequest(req, isNew = false) {
      const div = document.createElement('div');
      div.className = `request ${isNew ? 'new' : ''}`;
      div.innerHTML = `
        <div class="time">${req.timestamp}</div>
        <strong>${req.method} ${req.url}</strong>
        <pre>Query: ${JSON.stringify(req.query, null, 2)}</pre>
        <pre>Full URL: ${req.fullUrl}</pre>
      `;
      requestsDiv.prepend(div);
    }

    function updateFromURL() {
      const url = new URL(window.location.href);
      if (url.search || url.hash) {
        const newRequest = {
          id: Date.now(),
          timestamp: new Date().toLocaleTimeString('uz-UZ'),
          method: "GET",
          url: url.pathname + url.search,
          fullUrl: url.href,
          query: Object.fromEntries(url.searchParams),
        };

        // Agar oxirgi request bilan bir xil bo'lmasa qo'shish
        if (requests.length === 0 || requests[0].fullUrl !== newRequest.fullUrl) {
          requests.unshift(newRequest);
          if (requests.length > 50) requests.pop();
          saveRequests();
          addRequest(newRequest, true);
        }
      }
    }

    // Boshlang'ich yuklash
    function loadAllRequests() {
      requestsDiv.innerHTML = '';
      requests.forEach(req => addRequest(req));
    }

    // Har 700ms da URL ni tekshirish
    setInterval(updateFromURL, 700);

    // Sahifa yangilanganda ham
    window.addEventListener('load', () => {
      loadAllRequests();
      updateFromURL();
    });

    // Boshqa tabda o'zgarganda sinxronizatsiya
    window.addEventListener('storage', () => {
      requests = JSON.parse(localStorage.getItem('allRequests')) || [];
      loadAllRequests();
    });
  </script>
</body>
</html>
