<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Bounty Test Page</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
        h1 { color: #333; }
        form { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>POST Request Test Sahifasi (Bug Bounty)</h1>
    
    <form id="postForm">
        <label><strong>Ism:</strong></label>
        <input type="text" name="name" placeholder="Ismingiz" required>

        <label><strong>Email:</strong></label>
        <input type="email" name="email" placeholder="email@example.com" required>

        <label><strong>Xabar:</strong></label>
        <textarea name="message" rows="5" placeholder="Xabaringiz..." required></textarea>

        <button type="submit">POST Request Yuborish</button>
    </form>

    <div id="result"></div>

    <script>
        const form = document.getElementById('postForm');
        const result = document.getElementById('result');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Oddiy submitni to'xtatamiz

            const formData = new FormData(form);
            const data = {};

            // Form ma'lumotlarini objectga aylantiramiz
            for (let [key, value] of formData.entries()) {
                data[key] = value;
            }

            // Natijani ekranda ko'rsatamiz
            result.innerHTML = `
                <strong>✅ POST Request Qabul Qilindi!</strong><br><br>
                <strong>Vaqt:</strong> ${new Date().toLocaleString('uz-UZ')}<br><br>
                <strong>JSON Formatda:</strong><br>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;

            // Konsolga ham chiqarish (bug bounty uchun qulay)
            console.log("POST Data:", data);
        });
    </script>
</body>
</html>
